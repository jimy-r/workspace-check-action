# Explicit lint config, not ruff's bare defaults: a bare-default `ruff check`
# silently changes what's linted across ruff releases. An explicit select makes
# a version bump safe.
target-version = "py39"
# Vendored verbatim from the flagship and checked byte for byte in CI, so it
# is linted there, never reformatted here.
extend-exclude = ["workspace_check.py"]

[lint]
# pycodestyle + pyflakes + isort + bugbear + pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
# Line length is the formatter's job; any E501 residual is a string/URL the
# formatter deliberately leaves alone.
ignore = ["E501"]
